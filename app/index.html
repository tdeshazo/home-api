<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home API</title>
    <link rel="icon" href="/assets/mark.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("home-api-theme");
          document.documentElement.dataset.theme = saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="mobile-header">
        <button class="icon-action" type="button" data-drawer-open aria-controls="mobileDrawer" aria-expanded="false" aria-label="Open navigation"><span data-icon="menu"></span></button>
        <a class="brand" href="/posts" aria-label="Home API">
          <img src="/assets/mark.svg" alt="" />
          <span>Home API</span>
        </a>
      </header>

      <div class="drawer-backdrop" data-drawer-backdrop hidden></div>
      <aside class="mobile-drawer" id="mobileDrawer" aria-label="Primary navigation" aria-hidden="true">
        <div class="drawer-head">
          <a class="brand" href="/posts" aria-label="Home API">
            <img src="/assets/mark.svg" alt="" />
            <span>Home API</span>
          </a>
          <button class="icon-action" type="button" data-drawer-close aria-label="Close navigation"><span data-icon="close"></span></button>
        </div>
        <div class="nav-profile" data-nav-profile hidden>
          <div class="avatar" data-nav-avatar></div>
          <div>
            <strong data-nav-name></strong>
            <span class="session" data-session-summary></span>
          </div>
        </div>
        <a class="secondary-action session-action" data-login-link href="/login">Login</a>
        <nav class="nav-menu" aria-label="Primary">
          <a href="/posts" aria-current="page">Posts</a>
          <a href="/tasks">Tasks</a>
          <a href="/tasks/dashboard">Dashboard</a>
        </nav>
        <div class="nav-footer">
          <button class="icon-action" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode"><span data-theme-icon></span></button>
          <button class="secondary-action session-action is-hidden" type="button" data-logout-button>Logout</button>
        </div>
      </aside>

      <nav class="side-rail" aria-label="Primary">
        <a class="brand" href="/posts" aria-label="Home API">
          <img src="/assets/mark.svg" alt="" />
          <span>Home API</span>
        </a>
        <div class="nav-profile" data-nav-profile hidden>
          <div class="avatar" data-nav-avatar></div>
          <div>
            <strong data-nav-name></strong>
            <span class="session" data-session-summary></span>
          </div>
        </div>
        <a class="secondary-action session-action" data-login-link href="/login">Login</a>
        <div class="nav-menu">
          <a href="/posts" aria-current="page">Posts</a>
          <a href="/tasks">Tasks</a>
          <a href="/tasks/dashboard">Dashboard</a>
        </div>
        <div class="nav-footer">
          <button class="icon-action" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode"><span data-theme-icon></span></button>
          <button class="secondary-action session-action is-hidden" type="button" data-logout-button>Logout</button>
        </div>
      </nav>

      <main class="workspace">
        <section class="timeline-panel" aria-labelledby="timelineTitle">
          <div class="panel-head timeline-head">
            <div>
              <h2 id="timelineTitle">Timeline</h2>
              <p id="timelineMeta"></p>
            </div>
            <button class="secondary-action icon-label-action" type="button" id="refreshPosts"><span data-icon="refresh"></span><span>Refresh</span></button>
          </div>
          <p class="status-line" id="authStatus" role="status"></p>

          <div class="signin-prompt" id="postSignInPrompt" hidden>
            <strong>Signed-out timeline view</strong>
            <span>Login to post, reply, and keep your session synced across the task tools.</span>
            <a class="primary-action" data-login-link href="/login">Login</a>
          </div>

          <form class="composer" id="postForm">
            <label>
              New post
              <textarea name="body" maxlength="280" rows="4" required></textarea>
            </label>
            <div class="composer-actions">
              <span id="postCounter">0/280</span>
              <div class="action-group">
                <div class="emoji-control" data-emoji-control>
                  <button class="icon-action" type="button" data-action="toggle-emoji" aria-label="Open emoji selector" aria-expanded="false"><span data-icon="smile"></span></button>
                  <div class="emoji-popover is-hidden" data-emoji-popover></div>
                </div>
                <button class="primary-action" type="submit">Post</button>
              </div>
            </div>
          </form>

          <div class="timeline-list" id="postsList" aria-live="polite"></div>

          <div class="scroll-status" id="scrollStatus" role="status"></div>
        </section>
      </main>
    </div>

    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
