services:
  postgres:
    image: postgres:17-alpine
    container_name: social_api_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
