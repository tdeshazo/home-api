name: ci

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual
    branch: ${CI_REPO_DEFAULT_BRANCH}

variables:
  registry: cr.home.deshazo.dev
  image_repo: cr.home.deshazo.dev/homeapi
  app_name: home-api-app
  app_port: 8888

steps:
  - name: lint
    image: golang:1.26.4-alpine
    commands: |
      apk add --no-cache git

      files="$(gofmt -l ./cmd ./internal)"
      if [ -n "$files" ]; then
        echo "The following files need gofmt:"
        echo "$files"
        exit 1
      fi

      go mod tidy
      git diff --exit-code go.mod go.sum
      go vet ./...

      go install honnef.co/go/tools/cmd/staticcheck@latest
      staticcheck ./...

  - name: test
    image: golang:1.26.4-alpine
    commands: |
      go test -shuffle=on ./...
      go test -shuffle=on ./... -coverprofile=coverage.out -covermode=atomic

  - name: race
    image: golang:1.26.4-alpine
    commands: |
      apk add --no-cache build-base
      CGO_ENABLED=1 go test -race -shuffle=on ./...

  - name: security
    image: golang:1.26.4-alpine
    commands: |
      go install golang.org/x/vuln/cmd/govulncheck@latest
      govulncheck ./...

  - name: build-push-deploy
    image: docker:28-cli
    environment:
      REGISTRY_USERNAME:
        from_secret: homeapi_registry_username
      REGISTRY_PASSWORD:
        from_secret: homeapi_registry_password
      DATABASE_URL:
        from_secret: homeapi_database_url
      JWT_SECRET:
        from_secret: homeapi_jwt_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands: |
      build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      docker version
      echo "$${REGISTRY_PASSWORD}" | docker login ${registry} -u "$${REGISTRY_USERNAME}" --password-stdin

      docker build \
        --build-arg GIT_SHA="$CI_COMMIT_SHA" \
        --build-arg BUILD_TIME="$build_time" \
        --label "org.opencontainers.image.created=$build_time" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_REPO_CLONE_URL" \
        -t ${image_repo}:$CI_COMMIT_SHA \
        .

      docker push ${image_repo}:$CI_COMMIT_SHA
      docker pull ${image_repo}:$CI_COMMIT_SHA
      docker rm -f ${app_name} 2>/dev/null || true

      docker run -d \
        --name ${app_name} \
        --restart unless-stopped \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "dev.deshazo.homeapi.managed-by=crow" \
        -p ${app_port}:8080 \
        --env APP_ENV=production \
        --env PORT=8080 \
        --env DATABASE_URL \
        --env LOG_LEVEL=info \
        --env LOG_SOURCE=false \
        --env AUTH_MODE=jwt \
        --env JWT_SECRET \
        --env JWT_ISSUER=home-api \
        --env JWT_AUDIENCE=home-api-api \
        --env AUTH_ACCESS_TOKEN_TTL=15m \
        --env AUTH_REFRESH_TOKEN_TTL=720h \
        ${image_repo}:$CI_COMMIT_SHA

      docker ps --filter "name=${app_name}"
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: manual
        branch: ${CI_REPO_DEFAULT_BRANCH}
