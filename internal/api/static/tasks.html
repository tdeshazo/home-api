<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks | Home API</title>
    <link rel="icon" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="mobile-header">
        <button class="icon-action" type="button" data-drawer-open aria-controls="mobileDrawer" aria-expanded="false" aria-label="Open navigation">☰</button>
        <a class="brand" href="/posts" aria-label="Home API">
          <img src="/assets/mark.svg" alt="" />
          <span>Home API</span>
        </a>
        <button class="icon-action" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
          <span data-theme-icon>◐</span>
        </button>
      </header>

      <div class="drawer-backdrop" data-drawer-backdrop hidden></div>
      <aside class="mobile-drawer" id="mobileDrawer" aria-label="Primary navigation" aria-hidden="true">
        <div class="drawer-head">
          <a class="brand" href="/posts" aria-label="Home API">
            <img src="/assets/mark.svg" alt="" />
            <span>Home API</span>
          </a>
          <button class="icon-action" type="button" data-drawer-close aria-label="Close navigation">×</button>
        </div>
        <div class="nav-profile" data-nav-profile hidden>
          <div class="avatar" data-nav-avatar></div>
          <div>
            <strong data-nav-name></strong>
            <span class="session" data-session-summary></span>
          </div>
        </div>
        <a class="secondary-action session-action" data-login-link href="/login">Login</a>
        <nav class="nav-menu" aria-label="Primary">
          <a href="/posts">Posts</a>
          <a href="/tasks" aria-current="page">Tasks</a>
          <a href="/tasks/dashboard">Dashboard</a>
        </nav>
        <div class="nav-footer">
          <button class="secondary-action" type="button" data-theme-toggle><span data-theme-icon>◐</span></button>
          <button class="secondary-action session-action is-hidden" type="button" data-logout-button>Logout</button>
        </div>
      </aside>

      <nav class="side-rail" aria-label="Primary">
        <a class="brand" href="/posts" aria-label="Home API">
          <img src="/assets/mark.svg" alt="" />
          <span>Home API</span>
        </a>
        <div class="nav-profile" data-nav-profile hidden>
          <div class="avatar" data-nav-avatar></div>
          <div>
            <strong data-nav-name></strong>
            <span class="session" data-session-summary></span>
          </div>
        </div>
        <a class="secondary-action session-action" data-login-link href="/login">Login</a>
        <div class="nav-menu">
          <a href="/posts">Posts</a>
          <a href="/tasks" aria-current="page">Tasks</a>
          <a href="/tasks/dashboard">Dashboard</a>
        </div>
        <div class="nav-footer">
          <button class="secondary-action" type="button" data-theme-toggle><span data-theme-icon>◐</span></button>
          <button class="secondary-action session-action is-hidden" type="button" data-logout-button>Logout</button>
        </div>
      </nav>

      <main class="workspace">
        <section class="timeline-panel" aria-labelledby="tasksTitle">
          <div class="panel-head timeline-head">
            <div>
              <h2 id="tasksTitle">Tasks</h2>
              <p id="tasksMeta"></p>
            </div>
            <button class="secondary-action" type="button" id="refreshTasks">Refresh</button>
          </div>
          <p class="status-line" id="authStatus" role="status"></p>

          <form class="composer task-composer" id="taskForm">
            <label>
              New task
              <input name="title" type="text" maxlength="200" required />
            </label>
            <div class="task-settings-grid">
              <label>
                Frequency
                <select name="frequency_kind">
                  <option value="daily" selected>Daily</option>
                  <option value="weekly">Weekly</option>
                </select>
              </label>
              <label>
                Points
                <input name="point_value" type="number" min="0" step="1" value="0" required />
              </label>
            </div>
            <fieldset class="choice-group is-hidden" id="weeklyDays">
              <legend>Days</legend>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="1" /> Mon</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="2" /> Tue</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="3" /> Wed</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="4" /> Thu</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="5" /> Fri</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="6" /> Sat</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="7" /> Sun</label>
            </fieldset>
            <fieldset class="choice-group">
              <legend>Assignees</legend>
              <div class="assignee-grid" id="assignees"></div>
            </fieldset>
            <div class="toggle-row">
              <label class="check-option"><input type="checkbox" name="is_active" checked /> Active</label>
              <label class="check-option"><input type="checkbox" name="individual" /> Individual</label>
            </div>
            <div class="composer-actions">
              <span id="taskCounter">0/200</span>
              <button class="primary-action" type="submit">Add task</button>
            </div>
          </form>

          <div class="tasks-list" id="tasksList" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="/assets/tasks.js" type="module"></script>
  </body>
</html>
