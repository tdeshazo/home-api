<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks | Home API</title>
    <link rel="icon" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/posts" aria-label="Home API">
          <img src="/assets/mark.svg" alt="" />
          <span>Home API</span>
        </a>
        <div class="topbar-actions">
          <nav class="topnav" aria-label="Primary">
            <a href="/posts">Posts</a>
            <a href="/tasks" aria-current="page">Tasks</a>
            <a href="/tasks/dashboard">Dashboard</a>
          </nav>
          <button class="icon-action" type="button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <span id="themeIcon">◐</span>
          </button>
          <div class="session" id="sessionSummary"></div>
        </div>
      </header>

      <main class="workspace">
        <section class="auth-panel" aria-labelledby="authTitle">
          <div class="panel-head">
            <h1 id="authTitle">Account</h1>
            <div class="mode-tabs" role="tablist" aria-label="Authentication mode">
              <button class="tab is-active" type="button" data-auth-tab="login">Login</button>
              <button class="tab" type="button" data-auth-tab="register">Register</button>
              <button class="tab" type="button" data-auth-tab="dev">Dev</button>
            </div>
          </div>

          <form class="auth-form" id="loginForm" data-auth-view="login">
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <button class="primary-action" type="submit">Login</button>
          </form>

          <form class="auth-form is-hidden" id="registerForm" data-auth-view="register">
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              Handle
              <input name="handle" type="text" autocomplete="username" minlength="3" maxlength="32" required />
            </label>
            <label>
              Display name
              <input name="display_name" type="text" autocomplete="name" required />
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="new-password" minlength="8" required />
            </label>
            <button class="primary-action" type="submit">Register</button>
          </form>

          <div class="dev-auth is-hidden" data-auth-view="dev">
            <div class="dev-grid">
              <button type="button" class="secondary-action" data-dev-user="00000000-0000-0000-0000-000000000001">Alice</button>
              <button type="button" class="secondary-action" data-dev-user="00000000-0000-0000-0000-000000000002">Bob</button>
            </div>
            <label>
              User UUID
              <input id="devUserID" type="text" value="00000000-0000-0000-0000-000000000001" />
            </label>
            <button class="primary-action" type="button" id="devLogin">Use dev token</button>
          </div>

          <button class="ghost-action" type="button" id="logoutButton">Logout</button>
          <p class="status-line" id="authStatus" role="status"></p>
        </section>

        <section class="timeline-panel" aria-labelledby="tasksTitle">
          <div class="panel-head timeline-head">
            <div>
              <h2 id="tasksTitle">Tasks</h2>
              <p id="tasksMeta"></p>
            </div>
            <button class="secondary-action" type="button" id="refreshTasks">Refresh</button>
          </div>

          <form class="composer task-composer" id="taskForm">
            <label>
              New task
              <input name="title" type="text" maxlength="200" required />
            </label>
            <div class="task-settings-grid">
              <label>
                Frequency
                <select name="frequency_kind">
                  <option value="daily" selected>Daily</option>
                  <option value="weekly">Weekly</option>
                </select>
              </label>
              <label>
                Points
                <input name="point_value" type="number" min="0" step="1" value="0" required />
              </label>
            </div>
            <fieldset class="choice-group is-hidden" id="weeklyDays">
              <legend>Days</legend>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="1" /> Mon</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="2" /> Tue</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="3" /> Wed</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="4" /> Thu</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="5" /> Fri</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="6" /> Sat</label>
              <label class="check-option"><input type="checkbox" name="days_of_week" value="7" /> Sun</label>
            </fieldset>
            <fieldset class="choice-group">
              <legend>Assignees</legend>
              <div class="assignee-grid" id="assignees"></div>
            </fieldset>
            <div class="toggle-row">
              <label class="check-option"><input type="checkbox" name="is_active" checked /> Active</label>
              <label class="check-option"><input type="checkbox" name="individual" /> Individual</label>
            </div>
            <div class="composer-actions">
              <span id="taskCounter">0/200</span>
              <button class="primary-action" type="submit">Add task</button>
            </div>
          </form>

          <div class="tasks-list" id="tasksList" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="/assets/tasks.js" type="module"></script>
  </body>
</html>
