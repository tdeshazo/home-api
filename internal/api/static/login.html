<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Home API</title>
    <link rel="icon" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="mobile-header">
        <button class="icon-action" type="button" data-drawer-open aria-controls="mobileDrawer" aria-expanded="false" aria-label="Open navigation">☰</button>
        <a class="brand" href="/posts" aria-label="Home API">
          <img src="/assets/mark.svg" alt="" />
          <span>Home API</span>
        </a>
        <button class="icon-action" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
          <span data-theme-icon>◐</span>
        </button>
      </header>

      <div class="drawer-backdrop" data-drawer-backdrop hidden></div>
      <aside class="mobile-drawer" id="mobileDrawer" aria-label="Primary navigation" aria-hidden="true">
        <div class="drawer-head">
          <a class="brand" href="/posts" aria-label="Home API">
            <img src="/assets/mark.svg" alt="" />
            <span>Home API</span>
          </a>
          <button class="icon-action" type="button" data-drawer-close aria-label="Close navigation">×</button>
        </div>
        <div class="nav-profile" data-nav-profile hidden>
          <div class="avatar" data-nav-avatar></div>
          <div>
            <strong data-nav-name></strong>
            <span class="session" data-session-summary></span>
          </div>
        </div>
        <nav class="nav-menu" aria-label="Primary">
          <a href="/posts">Posts</a>
          <a href="/tasks">Tasks</a>
          <a href="/tasks/dashboard">Dashboard</a>
        </nav>
        <div class="nav-footer">
          <button class="secondary-action" type="button" data-theme-toggle><span data-theme-icon>◐</span></button>
          <button class="secondary-action session-action is-hidden" type="button" data-logout-button>Logout</button>
        </div>
      </aside>

      <nav class="side-rail" aria-label="Primary">
        <a class="brand" href="/posts" aria-label="Home API">
          <img src="/assets/mark.svg" alt="" />
          <span>Home API</span>
        </a>
        <div class="nav-profile" data-nav-profile hidden>
          <div class="avatar" data-nav-avatar></div>
          <div>
            <strong data-nav-name></strong>
            <span class="session" data-session-summary></span>
          </div>
        </div>
        <div class="nav-menu">
          <a href="/posts">Posts</a>
          <a href="/tasks">Tasks</a>
          <a href="/tasks/dashboard">Dashboard</a>
        </div>
        <div class="nav-footer">
          <button class="secondary-action" type="button" data-theme-toggle><span data-theme-icon>◐</span></button>
          <button class="secondary-action session-action is-hidden" type="button" data-logout-button>Logout</button>
        </div>
      </nav>

      <main class="login-shell">
        <section class="auth-panel login-panel" aria-labelledby="authTitle">
          <div class="panel-head">
            <h1 id="authTitle">Account</h1>
            <div class="mode-tabs" role="tablist" aria-label="Authentication mode">
              <button class="tab is-active" type="button" data-auth-tab="login">Login</button>
              <button class="tab" type="button" data-auth-tab="register">Register</button>
              <button class="tab" type="button" data-auth-tab="dev">Dev</button>
            </div>
          </div>

          <form class="auth-form" id="loginForm" data-auth-view="login">
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <button class="primary-action" type="submit">Login</button>
          </form>

          <form class="auth-form is-hidden" id="registerForm" data-auth-view="register">
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              Handle
              <input name="handle" type="text" autocomplete="username" minlength="3" maxlength="32" required />
            </label>
            <label>
              Display name
              <input name="display_name" type="text" autocomplete="name" required />
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="new-password" minlength="8" required />
            </label>
            <button class="primary-action" type="submit">Register</button>
          </form>

          <div class="dev-auth is-hidden" data-auth-view="dev">
            <div class="dev-grid">
              <button type="button" class="secondary-action" data-dev-user="00000000-0000-0000-0000-000000000001">Alice</button>
              <button type="button" class="secondary-action" data-dev-user="00000000-0000-0000-0000-000000000002">Bob</button>
            </div>
            <label>
              User UUID
              <input id="devUserID" type="text" value="00000000-0000-0000-0000-000000000001" />
            </label>
            <button class="primary-action" type="button" id="devLogin">Use dev token</button>
          </div>

          <button class="ghost-action is-hidden" type="button" data-logout-button>Logout</button>
          <p class="status-line" id="authStatus" role="status"></p>
        </section>
      </main>
    </div>

    <script src="/assets/login.js" type="module"></script>
  </body>
</html>
